name: Update BookBSL mobile result copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update device-neutral result wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'Most information is ready. Check the items on the right before sending.': 'Most information is ready. Check the information below before sending.',
              'Check the items on the right before sending your enquiry.': 'Check the information below before sending your enquiry.',
          }
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              raise SystemExit('No matching copy found; no change made.')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make result wording mobile friendly"
          git push
