name: Sync BookBSL navigation and footer

on:
  push:
    paths:
      - '.github/workflows/sync-global-navigation-footer.yml'
      - '.github/scripts/sync_global_navigation_footer.py'
      - 'bookbsl-header.css'
      - 'bookbsl-header.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply one canonical header, navigation and footer
        run: python .github/scripts/sync_global_navigation_footer.py

      - name: Verify navigation on every BookBSL HTML page
        run: |
          count=0
          for page in *.html; do
            if grep -q '<header class="top">' "$page"; then
              count=$((count + 1))
              grep -q '>Guides</a><a href="awareness.html"' "$page"
              grep -q '>Access preparation</a><a href="data.html"' "$page"
              grep -q 'desktopCtaText">Start checklist' "$page"
              grep -q 'bookbsl-header.css?v=20260912-2' "$page"
              grep -q 'bookbsl-header.js?v=20260912-1' "$page"
              grep -q 'bookbsl-global-nav-footer-20260912' "$page"
              if grep -q 'nav-polish.js' "$page"; then
                echo "Old nav-polish.js still present in $page"
                exit 1
              fi
            fi
          done
          test "$count" -gt 0
          grep -q 'width:154px!important' bookbsl-header.css
          grep -q 'height:42px!important' bookbsl-header.css
          grep -q 'width:108px!important' bookbsl-header.css
          grep -q 'height:46px!important' bookbsl-header.css
          grep -q 'text-underline-offset:6px!important' bookbsl-header.css
          grep -q 'installBookBSLNavigation' bookbsl-header.js
          echo "Verified one canonical navigation system on $count BookBSL HTML pages"

      - name: Commit layout consistency update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Apply canonical BookBSL navigation to every HTML page"
          git push
