name: Sync BookBSL navigation and footer

on:
  push:
    paths:
      - '.github/workflows/sync-global-navigation-footer.yml'
      - '.github/scripts/sync_global_navigation_footer.py'
      - 'nav-polish.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply consistent header, navigation and footer
        run: python .github/scripts/sync_global_navigation_footer.py

      - name: Verify navigation on every BookBSL HTML page
        run: |
          count=0
          for page in *.html; do
            if grep -q '<header class="top">' "$page"; then
              count=$((count + 1))
              grep -q '>Guides</a><a href="awareness.html"' "$page"
              grep -q '>Access preparation</a><a href="data.html"' "$page"
              grep -q 'desktopCtaText">Start checklist' "$page"
              grep -q 'bookbsl-global-nav-footer-20260912' "$page"
              grep -q 'nav-polish.js?v=20260912-3' "$page"
              grep -q 'text-underline-offset:6px' "$page"
            fi
          done
          test "$count" -gt 0
          echo "Verified shared navigation on $count BookBSL HTML pages"

      - name: Commit layout consistency update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Sync shared BookBSL navigation across every HTML page"
          git push
