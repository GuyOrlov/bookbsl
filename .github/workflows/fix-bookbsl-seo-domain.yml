name: One-time BookBSL SEO domain fix

on:
  push:
    paths:
      - '.github/workflows/fix-bookbsl-seo-domain.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix BookBSL SEO signals for new domain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_files = [
              'index.html','awareness.html','data.html','law.html',
              'privacy.html','terms.html','cookies.html'
          ]

          for name in html_files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              # Move canonical, Open Graph and structured-data URLs to the live domain.
              text = text.replace('https://guyorlov.com/bookbsl/', 'https://bookbsl.co.uk/')
              text = text.replace('https://guyorlov.com/bookbsl', 'https://bookbsl.co.uk')

              if name == 'index.html':
                  text = text.replace(
                      'Need to book a British Sign Language (BSL) interpreter? Use BookBSL’s free 2-minute checklist to prepare your UK booking, check missing details and request a quote.',
                      'Book a BSL interpreter in the UK with BookBSL’s free 2-minute checklist. Prepare the right details, spot missing information and create a clear British Sign Language interpreter enquiry.'
                  )
                  text = text.replace(
                      'Book British Sign Language support <span>properly.</span>',
                      'Book a BSL Interpreter in the UK <span>with confidence.</span>'
                  )
                  text = text.replace(
                      'Need to book a BSL interpreter in the UK? British Sign Language booking made simple.',
                      'Need a British Sign Language interpreter? Prepare an in-person, online, workplace, event or appointment booking in about 2 minutes.'
                  )

              p.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              text = text.replace('https://guyorlov.com/bookbsl/', 'https://bookbsl.co.uk/')
              text = text.replace('https://guyorlov.com/bookbsl', 'https://bookbsl.co.uk')
              text = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-09-12</lastmod>', text)
              sitemap.write_text(text, encoding='utf-8')

          Path('robots.txt').write_text(
              'User-agent: *\nAllow: /\n\nSitemap: https://bookbsl.co.uk/sitemap.xml\n',
              encoding='utf-8'
          )
          PY

          if git diff --quiet && git ls-files --error-unmatch robots.txt >/dev/null 2>&1; then
            echo 'No changes needed'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html terms.html cookies.html sitemap.xml robots.txt
          git commit -m 'Fix BookBSL SEO signals for bookbsl.co.uk'
          git push
