name: Finalise BookBSL navigation

on:
  push:
    paths:
      - '.github/workflows/finalise-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final navigation
        run: python .github/scripts/finalise_navigation.py
      - name: Verify final navigation
        run: |
          grep -R --include='*.html' -l '<nav class="topnav"' . | while read -r f; do
            grep -q '>Guides</a>' "$f"
            grep -q '>Access preparation</a>' "$f"
            grep -q '>Data</a>' "$f"
            grep -q '>Start checklist</a>' "$f"
          done
      - name: Commit navigation update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Finalise BookBSL top navigation"
          git push
