name: Complete BookBSL SEO setup

on:
  push:
    paths:
      - '.github/workflows/bookbsl-seo-complete.yml'
      - '.github/scripts/bookbsl_seo_complete.py'
      - '.github/scripts/add_guides_nav.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BookBSL SEO improvements
        run: python .github/scripts/bookbsl_seo_complete.py
      - name: Finish homepage SEO navigation and social card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<meta name="twitter:card" content="summary">', '<meta name="twitter:card" content="summary_large_image">')
          if 'href="#guides"' not in text:
              text = text.replace('<a href="./#support">Support</a>', '<a href="#guides">Guides</a><a href="./#support">Support</a>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Add Guides to every page menu
        run: python .github/scripts/add_guides_nav.py
      - name: Verify files
        run: |
          test -f og-image.png
          test -f favicon.png
          test -f apple-touch-icon.png
          test -f page-analytics.js
          test -f stats.html
          test -f bsl-interpreter-events.html
          test -f bsl-interpreter-work-meetings.html
          test -f online-bsl-interpreter.html
          test -f bsl-interpreter-cost.html
          test -f how-to-book-bsl-interpreter.html
          test -f bsl-interpreter-healthcare.html
          test -f bsl-interpreter-education.html
          grep -q 'og:image' index.html
          grep -q 'summary_large_image' index.html
          grep -q 'id="guides"' index.html
          grep -q 'href="#guides"' index.html
          grep -q 'href="./#guides"' awareness.html
          grep -q 'href="./#guides"' data.html
          grep -q 'href="./#guides"' law.html
          grep -q 'href="./#guides"' bsl-interpreter-events.html
          grep -q 'href="./#guides"' bsl-interpreter-work-meetings.html
          grep -q 'href="./#guides"' online-bsl-interpreter.html
          grep -q 'href="./#guides"' bsl-interpreter-cost.html
          grep -q 'href="./#guides"' how-to-book-bsl-interpreter.html
          grep -q 'href="./#guides"' bsl-interpreter-healthcare.html
          grep -q 'href="./#guides"' bsl-interpreter-education.html
          grep -q 'noindex,follow' privacy.html
          grep -q 'bsl-interpreter-events.html' sitemap.xml
      - name: Commit SEO update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Show Guides in every BookBSL page menu'
            git push
          fi
