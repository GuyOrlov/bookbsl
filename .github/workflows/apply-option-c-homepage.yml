name: Apply BookBSL conversion-first homepage

on:
  push:
    paths:
      - '.github/workflows/apply-option-c-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conversion-first homepage
        run: python .github/scripts/apply_option_c_homepage.py

      - name: Verify homepage conversion order and copy
        run: |
          grep -Fq 'Book a British Sign Language interpreter in the UK' index.html
          grep -Fq 'Already know what you need? Request availability &amp; a quote' index.html
          grep -Fq '<!-- homepage-order: conversion-first -->' index.html

      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make BookBSL homepage conversion first'
            git push
          fi
