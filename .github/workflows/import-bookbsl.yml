name: Import BookBSL site

on:
  push:
    paths:
      - '.github/workflows/import-bookbsl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current BookBSL pages into repository root
        run: |
          set -euo pipefail
          base='https://guyorlov.com/bookbsl'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          get_page() {
            curl --retry 3 --retry-delay 2 -A "$UA" -H 'Cache-Control: no-cache' -fsSL "$1" -o "$2"
          }
          get_page "$base/" index.html
          get_page "$base/awareness.html" awareness.html
          get_page "$base/data.html" data.html
          get_page "$base/law.html" law.html
          get_page "$base/privacy.html" privacy.html
          get_page "$base/cookies.html" cookies.html
          get_page "$base/terms.html" terms.html
          get_page "$base/sitemap.xml" sitemap.xml
          touch .nojekyll
      - name: Verify imported site
        run: |
          test -s index.html
          test -s awareness.html
          test -s data.html
          test -s law.html
          test -s privacy.html
          test -s cookies.html
          test -s terms.html
          test -s sitemap.xml
          grep -q 'BookBSL' index.html
          grep -q 'Clear booking. Clear communication.' awareness.html
      - name: Commit imported BookBSL site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html cookies.html terms.html sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo 'BookBSL site already imported'
          else
            git commit -m 'Import BookBSL website into standalone repository'
            git push
          fi
