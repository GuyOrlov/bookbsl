name: Import BookBSL site

on:
  push:
    paths:
      - '.github/workflows/import-bookbsl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4884-8210-a94f-ca0f20fb666f/raw?se=2026-09-11T21%3A03%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=c69c1ecb-f633-5085-a1f8-ae205ead0e43&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T02%3A18%3A04Z&ske=2026-09-12T02%3A18%3A04Z&sks=b&skv=2026-02-06&sig=JNKgayAT7hbxhJJoJqn4C7saUwg%2BUc/vPWqKDFi/inU%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download BookBSL migration package
        run: |
          set -euo pipefail
          curl -fsSL "$ARTIFACT_URL" -o /tmp/bookbsl-migration.zip
          unzip -t /tmp/bookbsl-migration.zip
          rm -rf /tmp/bookbsl-migration
          mkdir -p /tmp/bookbsl-migration
          unzip -q /tmp/bookbsl-migration.zip -d /tmp/bookbsl-migration
      - name: Copy BookBSL pages into repository root
        run: |
          set -euo pipefail
          cp /tmp/bookbsl-migration/index.html ./index.html
          cp /tmp/bookbsl-migration/awareness.html ./awareness.html
          cp /tmp/bookbsl-migration/data.html ./data.html
          cp /tmp/bookbsl-migration/law.html ./law.html
          cp /tmp/bookbsl-migration/privacy.html ./privacy.html
          cp /tmp/bookbsl-migration/cookies.html ./cookies.html
          cp /tmp/bookbsl-migration/terms.html ./terms.html
          cp /tmp/bookbsl-migration/sitemap.xml ./sitemap.xml
          touch .nojekyll
      - name: Verify imported site
        run: |
          test -s index.html
          test -s awareness.html
          test -s data.html
          test -s law.html
          test -s privacy.html
          test -s cookies.html
          test -s terms.html
          test -s sitemap.xml
          grep -q 'BookBSL' index.html
          grep -q 'Clear booking. Clear communication.' awareness.html
      - name: Commit imported BookBSL site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html cookies.html terms.html sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo 'BookBSL site already imported'
          else
            git commit -m 'Import BookBSL website into standalone repository'
            git push
          fi
