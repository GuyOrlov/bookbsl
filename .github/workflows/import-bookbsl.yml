name: Import BookBSL site

on:
  push:
    paths:
      - '.github/workflows/import-bookbsl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy BookBSL pages from existing GitHub repository
        run: |
          set -euo pipefail
          source_repo='GuyOrlov/guyorlov.github.io'
          for file in index.html awareness.html data.html law.html privacy.html cookies.html terms.html sitemap.xml; do
            echo "COPY bookbsl/$file"
            gh api "repos/$source_repo/contents/bookbsl/$file?ref=main" --jq '.content' | tr -d '\n' | base64 -d > "$file"
          done
          touch .nojekyll
      - name: Verify imported site
        run: |
          test -s index.html
          test -s awareness.html
          test -s data.html
          test -s law.html
          test -s privacy.html
          test -s cookies.html
          test -s terms.html
          test -s sitemap.xml
          grep -q 'BookBSL' index.html
          grep -q 'Clear booking. Clear communication.' awareness.html
      - name: Commit imported BookBSL site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html cookies.html terms.html sitemap.xml .nojekyll
          if git diff --cached --quiet; then
            echo 'BookBSL site already imported'
          else
            git commit -m 'Import BookBSL website into standalone repository'
            git push
          fi
