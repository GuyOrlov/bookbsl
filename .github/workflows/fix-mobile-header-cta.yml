name: One-time BookBSL mobile header CTA fix

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-header-cta.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide oversized header CTA on mobile and tablet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = ['index.html','awareness.html','data.html','law.html','privacy.html','terms.html','cookies.html']
          css = '''\n/* BookBSL mobile/tablet header CTA fix 2026-09-12 */\n@media (max-width:900px){\n  .topnav .header-cta,\n  .topnav a.header-cta,\n  .topnav .btn.header-cta{display:none!important;}\n}\n'''

          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              marker = '/* BookBSL mobile/tablet header CTA fix 2026-09-12 */'
              if marker in text:
                  continue
              text = text.replace('</style>', css + '\n</style>', 1)
              p.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html terms.html cookies.html
          git commit -m 'Fix BookBSL mobile header checklist button'
          git push
