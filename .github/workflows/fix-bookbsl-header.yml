name: One-time BookBSL header fix

on:
  push:
    paths:
      - '.github/workflows/fix-bookbsl-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Standardise BookBSL headers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'index.html',
              'awareness.html',
              'data.html',
              'law.html',
              'privacy.html',
              'terms.html',
              'cookies.html',
          ]

          css = r'''
          /* BookBSL unified header 2026-09-12 */
          .top .shell{width:min(1160px,calc(100% - 32px))!important;margin:auto!important}
          .topin{height:68px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:18px!important}
          .brand{display:flex!important;align-items:center!important;gap:11px!important;text-decoration:none!important;font-weight:800!important;letter-spacing:-.04em!important;font-size:1.3rem!important;line-height:1!important;flex:0 0 auto!important}
          .brandmark{width:42px!important;height:42px!important;border-radius:13px 13px 13px 5px!important;background:var(--ink)!important;color:var(--yellow)!important;display:grid!important;place-items:center!important;font-size:.84rem!important;font-weight:800!important;letter-spacing:-.03em!important;line-height:1!important;flex:0 0 auto!important}
          .brand b{color:var(--blue)!important}
          .brandSub{display:block!important;font-size:.65rem!important;letter-spacing:0!important;color:var(--muted)!important;font-weight:750!important;margin-top:2px!important;line-height:1.15!important}
          .topnav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:20px!important;flex:0 0 auto!important}
          .topnav>a:not(.header-cta){display:inline-flex!important;align-items:center!important;text-decoration:none!important;font-size:.92rem!important;font-weight:700!important;line-height:1!important;white-space:nowrap!important}
          .topnav .header-cta{display:inline-flex!important;align-items:center!important;justify-content:center!important;box-sizing:border-box!important;height:42px!important;min-height:42px!important;min-width:170px!important;padding:0 20px!important;border:2px solid var(--ink)!important;border-radius:999px!important;background:var(--ink)!important;color:#fff!important;text-decoration:none!important;font-size:.92rem!important;font-weight:800!important;line-height:1!important;letter-spacing:-.01em!important;white-space:nowrap!important;box-shadow:none!important;flex:0 0 auto!important}

          @media(max-width:680px){
            .top .shell{width:min(100% - 22px,1160px)!important}
            .topin{height:62px!important;gap:10px!important}
            .brand{font-size:1rem!important;gap:8px!important;font-weight:800!important}
            .brandmark{width:34px!important;height:34px!important;font-size:.72rem!important;border-radius:11px 11px 11px 4px!important}
            .brandSub{display:none!important}
            .topnav{gap:10px!important;min-width:0!important}
            .topnav>a:not(.header-cta){display:inline-flex!important;font-size:.72rem!important;font-weight:700!important;line-height:1!important;white-space:nowrap!important}
            .topnav .mobileHide{display:inline-flex!important}
            .topnav .header-cta{display:none!important}
          }

          @media(max-width:420px){
            .top .shell{width:calc(100% - 18px)!important}
            .topin{gap:8px!important}
            .brand{font-size:.92rem!important;gap:7px!important}
            .brandmark{width:32px!important;height:32px!important;font-size:.68rem!important}
            .topnav{gap:6px!important}
            .topnav>a:not(.header-cta){font-size:.66rem!important}
          }
          /* End BookBSL unified header */
          '''

          def nav_link(href, label, active=False):
              current = ' aria-current="page"' if active else ''
              return f'<a href="{href}"{current}>{label}</a>'

          for filename in files:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              header = (
                  '<header class="top"><div class="shell topin">'
                  '<a class="brand" href="./"><span class="brandmark">BSL</span>'
                  '<span>Book<b>BSL</b><small class="brandSub">Clear booking. Clear communication.</small></span></a>'
                  '<nav class="topnav" aria-label="Main navigation">'
                  + nav_link('./#support', 'Support')
                  + nav_link('awareness.html', 'Awareness', filename == 'awareness.html')
                  + nav_link('data.html', 'Data', filename == 'data.html')
                  + nav_link('law.html', 'Laws', filename == 'law.html')
                  + '<a class="header-cta" href="./#checker">Start checklist</a>'
                  + '</nav></div></header>'
              )

              new_text, count = re.subn(
                  r'<header\s+class="top"[^>]*>.*?</header>',
                  header,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f'Could not replace header in {filename}; found {count}')

              new_text = re.sub(
                  r'\n?\s*/\* BookBSL unified header 2026-09-12 \*/.*?/\* End BookBSL unified header \*/\s*',
                  '\n',
                  new_text,
                  flags=re.S,
              )

              if '</style>' not in new_text:
                  raise RuntimeError(f'No closing style tag in {filename}')
              before, after = new_text.rsplit('</style>', 1)
              new_text = before.rstrip() + '\n' + css.strip() + '\n</style>' + after

              p.write_text(new_text, encoding='utf-8')
              print(f'Updated {filename}')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html awareness.html data.html law.html privacy.html terms.html cookies.html
          git commit -m 'Standardise BookBSL headers across pages'
          git push
